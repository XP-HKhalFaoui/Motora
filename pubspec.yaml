name: carnet_auto
# The Dart package name stays `carnet_auto`: renaming it would rewrite
# every `package:carnet_auto/...` import for no user-visible gain. The
# names users actually see — launcher label, bundle display name, in-app
# wordmark — are all Motora.
description: "Motora — suivi d'entretien automobile (Flutter + Supabase)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  supabase_flutter: ^2.5.6

  # State management
  flutter_riverpod: ^2.5.1

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Files / scans
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Charts
  fl_chart: ^0.68.0

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1

  # Design system
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Icon / splash generation (build-time only, not shipped)
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

# Source artwork lives in assets/icon/, produced by tool/generate_icon.py.
# It is deliberately not declared under `flutter: assets:` — both
# generators read it from disk at build time, so bundling it would only
# add dead weight to the app.
# Regenerate the platform icons with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Android adaptive: the launcher masks the foreground to its own shape,
  # so the mark is drawn smaller and the palette background fills behind.
  adaptive_icon_background: "#0E1520"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# Regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0E1520"
  color_dark: "#0E1520"
  image: "assets/icon/splash.png"
  image_dark: "assets/icon/splash.png"
  android_12:
    color: "#0E1520"
    color_dark: "#0E1520"
    image: "assets/icon/splash.png"
    image_dark: "assets/icon/splash.png"
